# Publishes a new version. Whether and when is decided by hand: push a tag like v0.24.0 and this builds the program on Windows and attaches it
# to a GitHub release. The island (Settings -> Updates) then finds it, downloads it and offers "Restart now". The release notes are the
# "Unreleased" section of CHANGELOG.md (what the website's "What's new" shows too).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Put the tag's version into Cargo.toml
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content Cargo.toml) -replace '^version = ".*"', "version = `"$v`"" | Set-Content Cargo.toml
      - run: cargo build --release --bin island
      - name: Name the file
        shell: pwsh
        run: Copy-Item target/release/island.exe Bloop.exe
      - name: Release notes (the Unreleased part of CHANGELOG.md)
        shell: pwsh
        run: |
          $t = Get-Content CHANGELOG.md -Raw
          $notes = ""
          if ($t -match '(?s)## Unreleased\s*(.*?)(?=\r?\n## |\z)') {
            $notes = ($Matches[1] -replace '(?s)<!--.*?-->', '').Trim()
          }
          Set-Content -Path notes.md -Value $notes
      - name: Publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hasNotes = (Get-Item notes.md).Length -gt 4
          # a release made in the GitHub web page already exists (the tag came with it): then just attach the file
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" Bloop.exe --clobber
            if ($hasNotes) { gh release edit "${{ github.ref_name }}" --notes-file notes.md }
          } elseif ($hasNotes) {
            gh release create "${{ github.ref_name }}" Bloop.exe --title "${{ github.ref_name }}" --notes-file notes.md
          } else {
            gh release create "${{ github.ref_name }}" Bloop.exe --title "${{ github.ref_name }}" --generate-notes
          }
