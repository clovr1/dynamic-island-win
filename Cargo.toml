[package]
name = "island"
version = "0.16.1"
edition = "2021"
description = "Bloop: a small native dynamic island for Windows (no web engine)"

[build-dependencies]
embed-resource = "2"

[dependencies]
tiny-skia = "0.11"
fontdue = { version = "0.9", default-features = false }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.58", features = [
  "ApplicationModel", "Devices_Radios", "Foundation", "Networking_Connectivity", "Networking_NetworkOperators", "Foundation_Collections", "Media_Control", "Storage_Streams", "UI_Notifications", "UI_Notifications_Management",
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Networking_WinHttp",
  "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WinRT",
  "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_Controls_Dialogs", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
