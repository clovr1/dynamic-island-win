[package]
name = "island"
version = "0.9.2"
edition = "2021"
description = "Dynamic Island for Windows: a small native notch (no web engine)"

[dependencies]
tiny-skia = "0.11"
fontdue = { version = "0.9", default-features = false }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
windows = { version = "0.58", features = [
  "ApplicationModel", "Foundation", "Foundation_Collections", "Media_Control", "Storage_Streams", "UI_Notifications", "UI_Notifications_Management",
  "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Networking_WinHttp",
  "Win32_Security", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_WinRT",
  "Win32_UI_Accessibility", "Win32_UI_Controls", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
